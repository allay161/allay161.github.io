---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>
  <div class="date">
    发表于 {{ page.date | date: "%Y年%m月%d日" }}
  </div>

  <div class="entry">
    {{ content }}
  </div>

  <!-- 导航链接：返回科目首页 -->
  <div style="margin-top: 30px; padding: 10px 0; border-top: 1px solid #eaecef;">
    <a href="/notes/" style="text-decoration: none; color: #0366d6;">📚 返回笔记总览</a>
    {% if page.subject %}
      | <a href="/notes/{{ page.subject }}/" style="text-decoration: none; color: #0366d6;">📖 返回 {{ page.subject }} 科目首页</a>
    {% endif %}
  </div>

  <!-- 翻页导航 -->
  <div class="post-nav">
    <div style="display: flex; justify-content: space-between; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eaecef;">
      <div>
        {% if page.previous.url %}
          <a href="{{ page.previous.url }}" style="text-decoration: none; color: #0366d6;">
            ← {{ page.previous.title }}
          </a>
        {% endif %}
      </div>
      <div>
        {% if page.next.url %}
          <a href="{{ page.next.url }}" style="text-decoration: none; color: #0366d6;">
            {{ page.next.title }} →
          </a>
        {% endif %}
      </div>
    </div>
  </div>
</article>
